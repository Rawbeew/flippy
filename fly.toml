# Fly.io config — free-tier deploy of the flippy router container.
# Deploy: fly launch --no-deploy && fly secrets set OPENROUTER_KEY=... && fly deploy
app = "flippy-router"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scales to zero on free tier
  auto_start_machines = true
  min_machines_running = 0
  processes = ["apps"]

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
