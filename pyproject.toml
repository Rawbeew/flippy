[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flippy"
version = "0.1.0"
description = "Multi-provider LLM failover router with semantic caching, quota-aware routing, and agent harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# aihub is the single entry point and routes through litellm, so litellm is a
# real dependency rather than an optional extra.
dependencies = ["litellm>=1.40"]
authors = [
    {name = "Rabiu Raji", email = "raji.rawbeew@gmail.com"},
]
keywords = ["llm", "router", "failover", "rate-limiting", "circuit-breaker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
# Multimodal extras: speech and image support in aihub. Everything else —
# routing, failover, RAG, the agent harness — works without them.
hub = ["edge-tts>=6.1", "pillow>=10.0"]
dev = ["pytest", "coverage"]

[project.scripts]
flippy = "aihub:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
